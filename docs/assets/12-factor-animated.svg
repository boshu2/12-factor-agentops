<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="The 12 factors as a four-phase loop: Prepare, Bound, Select, Govern, with Govern feeding back into Prepare">
  <title>The factor loop — Prepare → Bound → Select → Govern</title>
  <desc>The twelve factors arranged as a control loop in four phases of three. Prepare (Context, Track, Scope) flows into Bound (Least Privilege, Research, Isolate), into Select (Validate, Lock, Extract), into Govern (Compound, Supervise, Measure), which feeds back into Prepare.</desc>

  <defs>
    <linearGradient id="flPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0b08"/>
      <stop offset="100%" stop-color="#070605"/>
    </linearGradient>
    <filter id="flGlow"><feGaussianBlur stdDeviation="1.4"/></filter>
    <marker id="flArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="960" height="410" fill="#070a08"/>

  <!-- drawing strip -->
  <text x="30" y="30" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="1.5" fill="#b78318">FIG. 02 — THE FACTOR LOOP</text>
  <text x="930" y="30" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#6f6657">PREPARE → BOUND → SELECT → GOVERN</text>
  <line x1="30" y1="42" x2="930" y2="42" stroke="#f59e0b" stroke-opacity="0.22"/>

  <!-- corner ticks -->
  <g stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1">
    <path d="M30 56 h10 M30 56 v10"/><path d="M930 56 h-10 M930 56 v10"/>
    <path d="M30 320 h10 M30 320 v-10"/><path d="M930 320 h-10 M930 320 v-10"/>
  </g>

  <!-- ===== phase panels ===== -->
  <!-- group: x, phase, range, [I num,name] x3 -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <!-- PREPARE -->
    <g class="ph">
      <rect x="30" y="66" width="205" height="240" rx="7" fill="url(#flPanel)" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="46" y="92" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1">PREPARE</text>
      <text x="219" y="92" text-anchor="end" font-size="10" fill="#7d7363">I–III</text>
      <text x="46" y="106" font-size="9" fill="#8a8378">set up the environment</text>
      <line x1="46" y1="116" x2="219" y2="116" stroke="#f59e0b" stroke-opacity="0.18"/>
      <g>
        <text x="46" y="150" font-size="14" font-weight="700" fill="#fbbf24">I</text>   <text x="78" y="150" font-size="13" fill="#e8e4dd">Context</text>
        <text x="46" y="200" font-size="14" font-weight="700" fill="#fbbf24">II</text>  <text x="78" y="200" font-size="13" fill="#e8e4dd">Track</text>
        <text x="46" y="250" font-size="14" font-weight="700" fill="#fbbf24">III</text> <text x="92" y="250" font-size="13" fill="#e8e4dd">Scope</text>
      </g>
    </g>
    <!-- BOUND -->
    <g class="ph">
      <rect x="265" y="66" width="205" height="240" rx="7" fill="url(#flPanel)" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="281" y="92" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1">BOUND</text>
      <text x="454" y="92" text-anchor="end" font-size="10" fill="#7d7363">IV–VI</text>
      <text x="281" y="106" font-size="9" fill="#8a8378">constrain what may act</text>
      <line x1="281" y1="116" x2="454" y2="116" stroke="#f59e0b" stroke-opacity="0.18"/>
      <g>
        <text x="281" y="150" font-size="14" font-weight="700" fill="#fbbf24">IV</text>  <text x="319" y="150" font-size="13" fill="#e8e4dd">Privilege</text>
        <text x="281" y="200" font-size="14" font-weight="700" fill="#fbbf24">V</text>   <text x="313" y="200" font-size="13" fill="#e8e4dd">Research</text>
        <text x="281" y="250" font-size="14" font-weight="700" fill="#fbbf24">VI</text>  <text x="319" y="250" font-size="13" fill="#e8e4dd">Isolate</text>
      </g>
    </g>
    <!-- SELECT -->
    <g class="ph">
      <rect x="500" y="66" width="205" height="240" rx="7" fill="url(#flPanel)" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="516" y="92" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1">SELECT</text>
      <text x="689" y="92" text-anchor="end" font-size="10" fill="#7d7363">VII–IX</text>
      <text x="516" y="106" font-size="9" fill="#8a8378">decide what survives</text>
      <line x1="516" y1="116" x2="689" y2="116" stroke="#f59e0b" stroke-opacity="0.18"/>
      <g>
        <text x="516" y="150" font-size="14" font-weight="700" fill="#fbbf24">VII</text>  <text x="562" y="150" font-size="13" fill="#e8e4dd">Validate</text>
        <text x="516" y="200" font-size="14" font-weight="700" fill="#fbbf24">VIII</text> <text x="574" y="200" font-size="13" fill="#e8e4dd">Lock</text>
        <text x="516" y="250" font-size="14" font-weight="700" fill="#fbbf24">IX</text>   <text x="554" y="250" font-size="13" fill="#e8e4dd">Extract</text>
      </g>
    </g>
    <!-- GOVERN -->
    <g class="ph">
      <rect x="735" y="66" width="205" height="240" rx="7" fill="url(#flPanel)" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="751" y="92" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1">GOVERN</text>
      <text x="924" y="92" text-anchor="end" font-size="10" fill="#7d7363">X–XII</text>
      <text x="751" y="106" font-size="9" fill="#8a8378">steer and feed back</text>
      <line x1="751" y1="116" x2="924" y2="116" stroke="#f59e0b" stroke-opacity="0.18"/>
      <g>
        <text x="751" y="150" font-size="14" font-weight="700" fill="#fbbf24">X</text>    <text x="783" y="150" font-size="13" fill="#e8e4dd">Compound</text>
        <text x="751" y="200" font-size="14" font-weight="700" fill="#fbbf24">XI</text>   <text x="789" y="200" font-size="13" fill="#e8e4dd">Supervise</text>
        <text x="751" y="250" font-size="14" font-weight="700" fill="#fbbf24">XII</text>  <text x="797" y="250" font-size="13" fill="#e8e4dd">Measure</text>
      </g>
    </g>
  </g>

  <!-- forward arrows between phases -->
  <g stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="2 4" marker-end="url(#flArrow)">
    <line x1="238" y1="186" x2="262" y2="186"/>
    <line x1="473" y1="186" x2="497" y2="186"/>
    <line x1="708" y1="186" x2="732" y2="186"/>
  </g>

  <!-- feedback loop: Govern -> Prepare -->
  <path id="flLoop" d="M837 308 C837 360, 837 372, 760 372 L210 372 C133 372, 133 360, 133 308"
        fill="none" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#flArrow)"/>
  <rect x="404" y="362" width="152" height="20" rx="4" fill="#070a08"/>
  <text x="480" y="376" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="1" fill="#b78318">THE LOOP CLOSES</text>

  <style><![CDATA[
    .ph rect { transition: stroke-opacity 240ms ease; animation: flpulse 9s ease-in-out infinite; }
    .ph:nth-of-type(1) rect { animation-delay: 0s; }
    .ph:nth-of-type(2) rect { animation-delay: 1.2s; }
    .ph:nth-of-type(3) rect { animation-delay: 2.4s; }
    .ph:nth-of-type(4) rect { animation-delay: 3.6s; }
    .ph:hover rect, .ph:focus-within rect { stroke-opacity: 1; filter: url(#flGlow); }
    @keyframes flpulse { 0%, 85%, 100% { stroke-opacity: 0.45; } 8%, 22% { stroke-opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .ph rect { animation: none !important; stroke-opacity: 0.5 !important; } }
  ]]></style>
</svg>
